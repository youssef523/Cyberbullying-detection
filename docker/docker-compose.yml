services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cyberbullying-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: cyberbullying-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
